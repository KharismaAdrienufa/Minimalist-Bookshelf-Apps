<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf App</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="style.css">
    
    <!-- Impor script kamu di sini -->
    <!-- Lampirkan `defer` jika pemanggilan dilakukan dalam <head> -->
      <script defer src="main.js"></script>
    </head>
    <body>
      <header>
        <section class="searchBook-bar">
          <form id="searchBook" data-testid="searchBookForm">
            <label for="searchBookTitle" class="semi-hidden">Title</label>
            <input id="searchBookTitle" type="text" data-testid="searchBookFormTitleInput" class="search-box"/>
            <button id="searchSubmit" type="submit" data-testid="searchBookFormSubmitButton" class="search-button">
              <i class="material-icons">search</i>
            </button>
          </form>
        </section>
      </header>
      
      <main>
        <div class="main-content">
          <h1>Booksh<br>elf<br>App</h1>
          <hr class="line-deco">
          <div class="listBook-content">
            <section class="incompleteBook card">
              <h3>Incomplete Book</h3>
              <div id="incompleteBookList" data-testid="incompleteBookList" class="incompleteBookList">
              </div>
            </section>
            <section class="completeBook card">
              <h3>Complete Book</h3>
              <div id="completeBookList" data-testid="completeBookList" class="completeBookList">
              </div>
            </section>
          </div>
        </div>
        <div class="side-content">
          <section class="addBook card">
            <h3>Add Book</h3>
            <form id="bookForm" data-testid="bookForm" class="addBook-form">
              <div>
                <label for="bookFormTitle">Title</label>
                <input id="bookFormTitle" type="text" required data-testid="bookFormTitleInput" />
              </div>
              <div>
                <label for="bookFormAuthor">Author</label>
                <input id="bookFormAuthor" type="text" required data-testid="bookFormAuthorInput" />
              </div>
              <div>
                <label for="bookFormYear">Year</label>
                <input id="bookFormYear" type="number" required data-testid="bookFormYearInput" />
              </div>
              <div class="checkBook">
                <label for="bookFormIsComplete">Completed</label>
                <input
                  id="bookFormIsComplete"
                  type="checkbox"
                  data-testid="bookFormIsCompleteCheckbox"
                  />
                </div>
              <button id="bookFormSubmit" type="submit" data-testid="bookFormSubmitButton" class="addBook-button">
                add
              </button>
            </form>
          </section>
        </div>
        <div id="overlay" class="overlay" hidden>
          <div id="confirmDelete" class="confirm card">
            <p>Are you sure you want to delete this book?</p>
            <section class="confirm-button">
              <button id="yes-button" class="yes-button">yes</button>
              <button id="no-button" class="no-button">no</button>
            </section>
          </div>
          <div id="editBook" class="editBook card">
            <h3>Edit Book</h3>
            <form id="editBookForm" class="editBook-form">
              <div>
                <label for="newBookTitle">New Title</label>
                <input id="newBookTitle" type="text" required />
              </div>
              <div>
                <label for="newBookAuthor">New Author</label>
                <input id="newBookAuthor" type="text" required />
              </div>
              <div>
                <label for="newBookYear">New Year</label>
                <input id="newBookYear" type="number" required />
              </div>
              <div class="checkBook">
                <label for="newBookIsComplete">Completed</label>
                <input
                  id="newBookIsComplete"
                  type="checkbox"
                />
              </div>
              <div class="editBookAction-button">
                <button id="editBookFormSubmit" type="submit" class="editBook-button">save</button>
                <button id="cancelEditBook" class="cancelEditBook-button">cancel</button>
              </div>
            </form>
          </div>
        </div>
      </main>
  </body>
</html>
